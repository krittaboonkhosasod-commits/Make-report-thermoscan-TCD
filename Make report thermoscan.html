<style>
:root{--tx:#000;--mu:rgba(60,60,67,.62);--sep:rgba(60,60,67,.18);--glass:rgba(255,255,255,.58);--glass2:rgba(255,255,255,.9);--fld:rgba(118,118,128,.12);--ac:#007aff;--acs:rgba(0,122,255,.14);--w:#c93400;--sh:rgba(20,30,80,.14);--bg1:#dbeafe;--bg2:#e9d5ff;--bg3:#fbcfe8;--bg4:#bbf7d0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--tx:#fff;--mu:rgba(235,235,245,.6);--sep:rgba(84,84,88,.6);--glass:rgba(40,40,48,.5);--glass2:rgba(44,44,50,.92);--fld:rgba(118,118,128,.24);--ac:#0a84ff;--acs:rgba(10,132,255,.22);--w:#ff9f0a;--sh:rgba(0,0,0,.5);--bg1:#0b1d3a;--bg2:#2a1450;--bg3:#4a1a3a;--bg4:#0a3a3a}}
:root[data-theme="dark"]{--tx:#fff;--mu:rgba(235,235,245,.6);--sep:rgba(84,84,88,.6);--glass:rgba(40,40,48,.5);--glass2:rgba(44,44,50,.92);--fld:rgba(118,118,128,.24);--ac:#0a84ff;--acs:rgba(10,132,255,.22);--w:#ff9f0a;--sh:rgba(0,0,0,.5);--bg1:#0b1d3a;--bg2:#2a1450;--bg3:#4a1a3a;--bg4:#0a3a3a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%}
body{margin:0;min-height:100vh;color:var(--tx);font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",system-ui,"Noto Sans Thai",Tahoma,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;background:radial-gradient(60vmax 60vmax at 8% 4%,var(--bg1),transparent 60%),radial-gradient(55vmax 55vmax at 95% 12%,var(--bg2),transparent 60%),radial-gradient(60vmax 60vmax at 80% 100%,var(--bg3),transparent 60%),radial-gradient(55vmax 55vmax at 5% 95%,var(--bg4),transparent 60%),var(--bg1);background-attachment:fixed}
main{max-width:860px;margin:0 auto;padding:30px 16px 130px}
.hero{display:flex;align-items:center;gap:16px;padding:6px 6px 22px}
.hero h1{font-size:34px;line-height:1.08;font-weight:700;letter-spacing:.01em;margin:0 0 6px}
.hero p{margin:0;color:var(--mu);font-size:15px;line-height:1.35}
.hero div{min-width:0}
.card{background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);border:.5px solid rgba(255,255,255,.55);border-radius:28px;padding:20px;margin-bottom:18px;box-shadow:0 10px 34px var(--sh),inset 0 1px 0 rgba(255,255,255,.85),inset 0 -1px 0 rgba(255,255,255,.2)}
.step{display:flex;align-items:center;gap:10px;font-weight:600;font-size:19px;letter-spacing:-.02em;margin:0 0 16px}
.step .n{width:28px;height:28px;border-radius:50%;color:#fff;font-size:15px;font-weight:600;display:grid;place-items:center;flex:none;background:linear-gradient(180deg,#5ac8fa,#007aff);box-shadow:inset 0 1px 1px rgba(255,255,255,.7),0 3px 8px rgba(0,122,255,.35)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;padding:34px 16px;border:1.5px dashed var(--sep);border-radius:22px;background:var(--fld);cursor:pointer;transition:.2s}
.drop:hover,.drop.on{border-color:var(--ac);background:var(--acs)}
.drop:active{transform:scale(.99)}
.drop .di{width:60px;height:60px;border-radius:22.5%;color:#fff;display:grid;place-items:center;font-size:28px;font-weight:600;margin-bottom:10px;background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.7),transparent 42%),linear-gradient(150deg,#64d2ff,#0a84ff 55%,#5e5ce6);box-shadow:inset 0 1px 1px rgba(255,255,255,.8),inset 0 -3px 6px rgba(20,20,130,.3),0 8px 18px rgba(10,100,255,.35)}
.drop b{font-weight:600;font-size:17px}.drop small{color:var(--mu);font-size:14px}
#log{font-size:14px;color:var(--mu);margin-top:14px;line-height:1.55}#log:empty{display:none}.w{color:var(--w)}
label.l{display:block;font-size:13px;font-weight:500;color:var(--mu);margin:18px 8px 6px;text-transform:uppercase;letter-spacing:.02em}
input[type=text],textarea{width:100%;padding:12px 14px;border:0;border-radius:14px;background:var(--fld);color:var(--tx);font:inherit;font-size:17px;outline:none;transition:box-shadow .15s,background .15s}
input[type=text]:focus,textarea:focus{background:var(--glass2);box-shadow:0 0 0 3px rgba(0,122,255,.4)}
textarea{resize:vertical;font-size:15px}
.tw{overflow:auto;max-height:55vh;border-radius:20px;background:var(--glass2);border:.5px solid var(--sep)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:16px;min-width:780px}
th{position:sticky;top:0;z-index:1;background:var(--glass2);text-align:left;color:var(--mu);font-weight:500;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;padding:12px 8px;border-bottom:.5px solid var(--sep);white-space:nowrap}
td{padding:7px 6px;border-bottom:.5px solid var(--sep)}tr:last-child td{border-bottom:0}
td:first-child{color:var(--mu);font-variant-numeric:tabular-nums;padding-left:14px;white-space:nowrap}
td input{padding:9px 11px;font-size:15px;min-width:130px;border-radius:11px}
.fill{all:unset;cursor:pointer;margin-left:6px;color:var(--ac);font-size:12px;font-weight:600;text-transform:none;letter-spacing:0;padding:3px 10px;border-radius:99px;background:var(--acs);transition:.15s}
.fill:hover{filter:brightness(.95)}.fill:active{transform:scale(.94);opacity:.7}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px));pointer-events:none}
.bar[hidden]{display:none}
.bar button{pointer-events:auto;position:relative;overflow:hidden;display:block;width:100%;max-width:560px;margin:0 auto;color:#fff;border:0;border-radius:99px;padding:16px 22px;font:inherit;font-size:17px;font-weight:600;letter-spacing:-.01em;cursor:pointer;background:linear-gradient(180deg,#4fb3ff,#007aff);box-shadow:inset 0 1px 1px rgba(255,255,255,.75),inset 0 -2px 5px rgba(0,50,160,.28),0 10px 28px rgba(0,100,255,.42),0 2px 6px rgba(0,0,0,.12);transition:transform .15s,box-shadow .15s,opacity .15s}
.bar button::before{content:"";position:absolute;inset:2px 8% auto 8%;height:46%;border-radius:99px;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0));pointer-events:none}
.bar button:hover{box-shadow:inset 0 1px 1px rgba(255,255,255,.75),inset 0 -2px 5px rgba(0,50,160,.28),0 14px 32px rgba(0,100,255,.5),0 2px 6px rgba(0,0,0,.12)}
.bar button:active{transform:scale(.97);opacity:.92}.bar button:disabled{opacity:.45;cursor:default;transform:none}
.wm{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));z-index:1;pointer-events:none;user-select:none;-webkit-user-select:none;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);opacity:.55}
.conv{margin-left:auto;display:flex;align-items:center;gap:8px}
.ic{height:40px;width:auto;max-width:44px;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(0,0,0,.2))}
.t3d{padding-left:2mm;font-size:21px;font-weight:800;letter-spacing:0;transform:translateY(-3px);color:transparent;background-image:linear-gradient(180deg,rgba(255,255,255,.95) 0%,rgba(150,205,255,.55) 45%,rgba(40,130,255,.45) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:1.2px rgba(0,110,255,.6);filter:drop-shadow(0 1px 0 rgba(255,255,255,.9)) drop-shadow(0 3px 0 rgba(0,100,230,.28)) drop-shadow(0 8px 8px rgba(0,60,160,.3))}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .t3d{background-image:linear-gradient(180deg,rgba(255,255,255,.85) 0%,rgba(150,205,255,.4) 50%,rgba(60,140,255,.3) 100%);-webkit-text-stroke:1.2px rgba(160,210,255,.75);filter:drop-shadow(0 3px 0 rgba(40,110,230,.35)) drop-shadow(0 8px 8px rgba(0,0,0,.5))}}
.hero h1{font-size:clamp(26px,7.5vw,34px)}
.ok{color:#1c8a3a;font-weight:600}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .ok{color:#30d158}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.chip{padding:5px 12px;border-radius:99px;background:var(--acs);color:var(--ac);font-size:13px;font-weight:600}
.pg{height:6px;border-radius:99px;background:var(--fld);overflow:hidden;margin-top:10px}.pg i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#5ac8fa,#007aff);transition:width .2s}
td:first-child{position:sticky;left:0;z-index:1;background:var(--glass2)}th:first-child{left:0;z-index:2}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.t3d{background-image:linear-gradient(180deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,.55) 50%,rgba(0,0,0,.32) 100%);-webkit-text-stroke:1.2px rgba(0,0,0,.55);filter:drop-shadow(0 1px 0 rgba(255,255,255,.85)) drop-shadow(0 3px 0 rgba(0,0,0,.12)) drop-shadow(0 8px 8px rgba(0,0,0,.25))}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .t3d{background-image:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.5));-webkit-text-stroke:1.2px rgba(255,255,255,.7);filter:drop-shadow(0 3px 0 rgba(255,255,255,.12)) drop-shadow(0 8px 8px rgba(0,0,0,.5))}}
:root[data-theme="dark"] .t3d{background-image:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.5));-webkit-text-stroke:1.2px rgba(255,255,255,.7);filter:drop-shadow(0 3px 0 rgba(255,255,255,.12)) drop-shadow(0 8px 8px rgba(0,0,0,.5))}
.hero h1{display:flex;align-items:center;gap:12px}.cam{height:1.35em;width:auto;flex:none}.sw{flex:none;filter:drop-shadow(0 0 5px rgba(255,69,58,.55))}
@keyframes swing{0%,100%{transform:rotate(0)}50%{transform:rotate(180deg)}}.spin{transform-box:view-box;transform-origin:15px 15px;animation:swing 2.4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.spin{animation:none}}
.dw{position:relative;width:68px;height:68px;margin-bottom:10px;display:grid;place-items:center}.dw img{width:62px;height:62px;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,60,160,.3))}
.ub{position:absolute;right:-6px;bottom:-4px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(150deg,#64d2ff,#0a84ff 60%,#5e5ce6);border:2px solid rgba(255,255,255,.9);box-shadow:0 4px 10px rgba(10,100,255,.4)}
@keyframes up{0%,100%{transform:translateY(2px);opacity:.7}50%{transform:translateY(-2px);opacity:1}}.ua{animation:up 1.4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.ua{animation:none}}
.bar button{display:flex;align-items:center;justify-content:center;gap:12px}.gi{position:relative;width:34px;height:34px;flex:none}.gi img{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 3px 5px rgba(0,40,120,.35))}
.db{position:absolute;right:-6px;bottom:-4px;width:19px;height:19px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 2px 5px rgba(0,40,120,.35)}
@keyframes dn{0%,100%{transform:translateY(-1.5px);opacity:.7}50%{transform:translateY(1.5px);opacity:1}}.da{animation:dn 1.4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.da{animation:none}}
.bar button{background:linear-gradient(180deg,#3fcf86,#107c41);box-shadow:inset 0 1px 1px rgba(255,255,255,.7),inset 0 -2px 5px rgba(0,60,25,.3),0 10px 28px rgba(16,124,65,.42),0 2px 6px rgba(0,0,0,.12)}
.bar button:hover{box-shadow:inset 0 1px 1px rgba(255,255,255,.7),inset 0 -2px 5px rgba(0,60,25,.3),0 14px 32px rgba(16,124,65,.5),0 2px 6px rgba(0,0,0,.12)}
.gi{background:#fff;border-radius:10px;padding:3px;box-sizing:border-box}.gi img{filter:none}.db{background:#107c41;border:2px solid #fff}.da{stroke:#fff}

function pcap(s){s=s.replace(/ทับ/g,'/').trim();const a=[];let d=0,b='';for(const ch of s){if(ch==='('||ch==='[')d++;else if(ch===')'||ch===']')d=Math.max(0,d-1);if(ch===','&&!d){a.push(b.trim());b=''}else b+=ch}a.push(b.trim());const q=a.filter(Boolean);
  return q.length>=4?{loc:q[0]+' / '+q[1],device:q[2],det:q.slice(3).join(', ')}:q.length===3?{loc:q[0],device:q[1],det:q[2]}:{loc:'',device:s,det:''}}
async function parseDocx(file){
  const z=await JSZip.loadAsync(file),P=s=>new DOMParser().parseFromString(s,'text/xml'),rels={};
  P(await z.file('word/_rels/document.xml.rels').async('string')).querySelectorAll('Relationship').forEach(r=>rels[r.getAttribute('Id')]=r.getAttribute('Target'));
  const doc=P(await z.file('word/document.xml').async('string'));
  const T=e=>[...e.getElementsByTagNameNS(NW,'t')].map(t=>t.textContent).join('');
  const img=async e=>{const b=e.getElementsByTagNameNS(NA,'blip')[0];if(!b)return null;const t=rels[b.getAttributeNS(NR,'embed')];return t?await z.file('word/'+t.replace(/^\//,'')).async('base64'):null};
  const out=[];let cur=null,lastN=0,sub=0;
  for(const tr of doc.getElementsByTagNameNS(NW,'tr')){
    const cells=[...tr.children].filter(c=>c.localName==='tc');let tc=null,m=null,raw='';
    for(const c of cells){for(const p of c.getElementsByTagNameNS(NW,'p')){m=/^\s*(?:(\d+(?:\.\d+)?)(?=[\s.,]|$))?\s*[.,]?\s*(.*?)\s*\.IS\d\s*$/i.exec(T(p));if(m){raw=T(p);break}}if(m){tc=c;break}}
    if(tc){
      let date=null;for(const p of tc.getElementsByTagNameNS(NW,'p'))date=date||pdate(T(p));
      if(m[1]){lastN=parseFloat(m[1]);sub=0}else sub++;
      cur={n:lastN+sub*0.001,label:m[1]||'-',ref:(/^\s*(\d{1,4})/.exec(raw)||[])[1]||'',...pcap(m[2]),date,info:{},markers:[],thermal:await img(tc),visible:null};
      for(const c of cells)if(c!==tc&&!cur.visible)cur.visible=await img(c);
      out.push(cur);continue}
    if(!cur||cells.length!==2)continue;
    const k=T(cells[0]).replace(/[:\s\u00a0]+$/,'').trim(),v=T(cells[1]).trim();
    if(INFO.includes(k.toLowerCase()))cur.info[k.toLowerCase()]=v;else if(k&&num(v)!==null)cur.markers.push([k.toUpperCase(),num(v)]);
  }
  if(!out.length)throw new Error('ไม่พบข้อมูลภาพ (ชื่อลงท้าย .IS2) ในไฟล์ Word นี้');
  out.forEach((r,i)=>{r.i0=i;r.orig=r.ref?+r.ref:0});
  const res=out.filter(r=>r.orig).sort((a,b)=>a.orig-b.orig||a.i0-b.i0).concat(out.filter(r=>!r.orig));
  res.forEach((r,i)=>{r.slot=i+1;r.moved=!r.orig});
  return res;
}

const fA=b=>`IF(AND(${b}>=0,${b}<=10.9),"${N}",IF(AND(${b}>=11,${b}<=20.9),"${PR}",IF(AND(${b}>=21,${b}<=40.9),"${MO}",IF(${b}>=41,"${MJ}",""))))`;

function mg(ws,r1,c1,r2,c2,v,o={}){
  if(r1!==r2||c1!==c2)ws.mergeCells(r1,c1,r2,c2);
  for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++)if(!o.nb)ws.getCell(r,c).border=BD;
  const c=ws.getCell(r1,c1);c.value=v;c.alignment={horizontal:o.h||'center',vertical:'middle',wrapText:!!o.wrap};
  c.font={name:'Calibri',size:o.sz||11,bold:!!o.b};
  if(o.fill)c.fill={type:'pattern',pattern:'solid',fgColor:{argb:o.fill}};if(o.nf)c.numFmt=o.nf;return c}

function addTable(ws,h,title,rows,amb){
  mg(ws,h,1,h+1,4,title,{wrap:1,fill:'FFD9D9D9'});mg(ws,h,5,h+3,10,'Recommended Action',{fill:'FFD9D9D9'});
  mg(ws,h+2,1,h+3,1,'Position',{fill:'FFD9D9D9'});mg(ws,h+2,2,h+3,2,'Temp (°C)',{fill:'FFD9D9D9'});mg(ws,h+2,3,h+2,4,'Criteria',{fill:'FFD9D9D9'});
  mg(ws,h+3,3,h+3,3,'Normal',{fill:'FFD9D9D9'});mg(ws,h+3,4,h+3,4,'Abnormal',{fill:'FFD9D9D9'});
  rows.forEach((x,i)=>{const r=h+4+i;mg(ws,r,1,r,1,x.label);
    if(x.blank){const B='B'+r,hi=amb?20.9:15.9,lim=amb?21:16;
      mg(ws,r,2,r,2,{formula:`IF(COUNT(${x.c.join(',')})=2,${x.f},"")`,result:''},{nf:'0.0'});
      mg(ws,r,3,r,3,{formula:`IF(${B}="","",IF(AND(${B}>=0,${B}<=${hi}),"✔",""))`,result:''});
      mg(ws,r,4,r,4,{formula:`IF(${B}="","",IF(${B}>=${lim},"✔",""))`,result:''});
      mg(ws,r,5,r,10,{formula:`IF(${B}="","",${(amb?fA:fP)(B)})`,result:''},{wrap:1});return}
    if(x.d==null){mg(ws,r,2,r,2,'-');mg(ws,r,3,r,3,'-');mg(ws,r,4,r,4,'-');mg(ws,r,5,r,10,'-');return}
    const B='B'+r,hi=amb?20.9:15.9,lim=amb?21:16,res=amb?rA(x.d):rP(x.d);
    mg(ws,r,2,r,2,{formula:x.f,result:x.d},{nf:'0.0'});
    mg(ws,r,3,r,3,{formula:`IF(AND(${B}>=0,${B}<=${hi}),"✔","")`,result:ge(x.d,0,hi)?'✔':''});
    mg(ws,r,4,r,4,{formula:`IF(${B}>=${lim},"✔","")`,result:x.d>=lim?'✔':''});
    mg(ws,r,5,r,10,{formula:(amb?fA:fP)(B),result:res},{wrap:1});
  });
  const rg=`E${h+4}:J${h+6}`,st=a=>({fill:{type:'pattern',pattern:'solid',bgColor:{argb:a}}});
  ws.addConditionalFormatting({ref:rg,rules:[[MJ,'FFFF0000'],[MO,'FFFFFF00'],[PR,'FF00B0F0'],[N,'FF00FF00']].map(([t,c],i)=>({type:'containsText',operator:'containsText',text:t,priority:i+1+h*10,style:st(c)}))});
}

async function build(){
  const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('Report');const warn=[];
  [9,9,9,9,9,3.6,9,9,9,9].forEach((w,i)=>ws.getColumn(i+1).width=w);
  mg(ws,1,1,1,8,$('ttl').value,{h:'left',nb:1,sz:10});ws.getCell(1,1).alignment={horizontal:'left',vertical:'bottom'};ws.getRow(1).height=60;
  ws.addImage(wb.addImage({base64:LOGO,extension:'png'}),{tl:{col:9.14,row:0.134},ext:{width:58,height:58}});for(let c=1;c<=10;c++)ws.getCell(1,c).border={bottom:{style:'medium'}};
  const inp=[...document.querySelectorAll('#tb input')],saved=store.get();
  const bySlot={},maxSlot=recs[recs.length-1].slot;recs.forEach((r,i)=>{r.idx=i;bySlot[r.slot]=r});
  for(let N=1;N<=maxSlot;N++){const blank=!bySlot[N],rec=bySlot[N]||{device:'',info:{},markers:[],label:'-'},D=blank?'':'-';
    const g=key=>blank?'':inp.find(x=>+x.dataset.i===rec.idx&&x.dataset.k===key).value.trim();
    if(!blank)rec.device=g('dev');
    const loc=blank?'':(g('loc')||'-'),det=blank?'':(g('det')||'-'),rem=blank?'':(g('rem').replace(/^remark\s*:\s*/i,'')||'-');
    if(!blank&&rec.device)saved[rec.device]={loc,det,rem};
    const t=3+46*(N-1);
    mg(ws,t,1,t,3,'Thermal Image No.'+N,{h:'left',b:1,nb:1});
    if(rec.thermal)ws.addImage(wb.addImage({base64:rec.thermal,extension:ext(rec.thermal)}),{tl:{col:1,row:t+1},ext:{width:300,height:184}});else if(!blank)warn.push((rec.device||'ภาพ '+rec.label)+': ไม่พบภาพ Thermal');
    if(rec.visible)ws.addImage(wb.addImage({base64:rec.visible,extension:ext(rec.visible)}),{tl:{col:6.1,row:t+1},ext:{width:245,height:184}});else if(!blank)warn.push((rec.device||'ภาพ '+rec.label)+': ไม่พบภาพ Visible');
    mg(ws,t+12,2,t+12,5,'Thermal Image',{nb:1});mg(ws,t+12,7,t+12,10,'Visible Image',{nb:1});
    mg(ws,t+14,1,t+14,3,'Location (Floor/Room)',{fill:'FFD9D9D9'});mg(ws,t+14,4,t+14,7,'Devices or Panel',{fill:'FFD9D9D9'});mg(ws,t+14,8,t+14,10,'Detail',{fill:'FFD9D9D9'});
    mg(ws,t+15,1,t+15,3,loc,{wrap:1});mg(ws,t+15,4,t+15,7,rec.device||D,{wrap:1});mg(ws,t+15,8,t+15,10,det,{wrap:1});
    const emis=num(rec.info['emissivity']),amb=num(rec.info['background temperature']);
    const found={},extras=[],seen={};
    rec.markers.forEach(([n,v])=>{seen[n]=(seen[n]||0)+1;if(/^P[123]$/.test(n)&&!(n in found))found[n]=v;else extras.push(n+(seen[n]>1?' (#'+seen[n]+')':'')+' = '+v.toFixed(1)+'°C')});
    const hdr=(r,a,b)=>{mg(ws,r,2,r,5,a,{fill:'FFD9D9D9'});mg(ws,r,6,r,9,b,{fill:'FFD9D9D9'})};
    hdr(t+17,'IR Information','Value');
    mg(ws,t+18,2,t+18,5,'Date of Creation');mg(ws,t+18,6,t+18,9,rec.date||D,{nf:'[$-409]d-mmm-yy;@'});
    hdr(t+19,'Object Information','Value');
    mg(ws,t+20,2,t+20,5,'Emissivity');mg(ws,t+20,6,t+20,9,emis??D);
    mg(ws,t+21,2,t+21,5,'Ambient Temp (°C)');mg(ws,t+21,6,t+21,9,amb??D,{nf:'0.0'});
    hdr(t+22,'Position','Value');
    ['P1','P2','P3'].forEach((p,i)=>{mg(ws,t+23+i,2,t+23+i,5,p);mg(ws,t+23+i,6,t+23+i,9,found[p]??D,{nf:'0.0'})});
    mg(ws,t+27,2,t+27,9,'Thermographic Survey Suggested Actions Based on Temperature Rise',{b:1,nb:1});
    const P={P1:t+23,P2:t+24,P3:t+25},pr=[['P1','P2'],['P2','P3'],['P3','P1']];
    addTable(ws,t+29,'Temperature Difference (ΔT) Between\nSimilar Components under Similar Loading',
      pr.map(([a,b])=>({label:a+' - '+b,blank,c:[`F${P[a]}`,`F${P[b]}`],d:(a in found&&b in found)?Math.abs(found[a]-found[b]):null,f:`ABS(F${P[a]}-F${P[b]})`})),false);
    addTable(ws,t+37,'Temperature Difference (ΔT) Between\nComponent and Ambient Air Temperature',
      ['P1','P2','P3'].map(a=>({label:a+' - Amb.',blank,c:[`F${P[a]}`,`F${t+21}`],d:(a in found&&amb!=null)?Math.abs(found[a]-amb):null,f:`ABS(F${P[a]}-F${t+21})`})),true);
    let ex='';if(extras.length){ex='  (Extra marker not calculated: '+extras.join(', ')+')';warn.push((rec.device||'ภาพ '+rec.label)+': มีจุดวัดเพิ่มนอกเหนือ P1–P3 → '+extras.join(', '))}
    const dP=pr.filter(([a,b])=>a in found&&b in found).map(([a,b])=>rP(Math.abs(found[a]-found[b])));
    const dA=['P1','P2','P3'].filter(a=>a in found&&amb!=null).map(a=>rA(Math.abs(found[a]-amb)));
    const abn=[...dP,...dA].some(x=>x&&x!==N),INS='Refer to the instructions on Page';
    const nn=r=>`SUMPRODUCT((${r}<>"")*(${r}<>"Normal")*(${r}<>"-"))`,q=x=>String(x).replace(/"/g,'""');
    mg(ws,t+44,1,t+44,10,{formula:`"Remark : "&IF(${nn('E'+(t+33)+':E'+(t+35))}+${nn('E'+(t+41)+':E'+(t+43))}>0,"${INS}","${q(rem)}")&"${q(ex)}"`,result:'Remark : '+(abn?INS:rem)+ex},{h:'left',nb:1,wrap:1});
    for(let c=1;c<=10;c++)ws.getCell(t+45,c).border={bottom:{style:'medium',color:{argb:'FF808080'}}};
    if(N<maxSlot)ws.getRow(t+45).addPageBreak();
    if(N%10===0||N===maxSlot){const p=$('pg');if(p)p.style.width=(N/maxSlot*100)+'%';await new Promise(r=>setTimeout(r))}
  }
  store.set(saved);
  ws.pageSetup={paperSize:9,orientation:'portrait',fitToPage:true,fitToWidth:1,fitToHeight:0,printArea:'A1:J'+(3+46*maxSlot-1),printTitlesRow:'1:2',margins:{left:.7,right:.47,top:.35,bottom:.6,header:.3,footer:.3}};
  const ft=$('ftr').value.replace(/&/g,'&&');ws.headerFooter.oddFooter='&L&9'+(/^\d/.test(ft)?' ':'')+ft;
  const buf=await wb.xlsx.writeBuffer(),a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  a.download=docName+'_Report.xlsx';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000);return warn;
}
$('go').onclick=async()=>{$('go').disabled=true;$('gt').textContent='กำลังสร้าง…';$('log').innerHTML='กำลังสร้างรายงาน (ไฟล์ใหญ่อาจใช้เวลาสักครู่)...<div class="pg"><i id="pg"></i></div>';
  try{const w=await build();$('log').innerHTML='<span class="ok">✓ สร้างรายงานเสร็จแล้ว — ไฟล์ถูกดาวน์โหลดอัตโนมัติ</span>'+w.map(x=>'<br><span class="w">! '+x.replace(/</g,'&lt;')+'</span>').join('')}
  catch(err){$('log').innerHTML='<span class="w">เกิดข้อผิดพลาด: '+err.message+'</span>'}

$('f').addEventListener('click',()=>{$('f').value=''});const dz=$('drop');
['dragenter','dragover'].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.add('on')}));
['dragleave','drop'].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.remove('on')}));

$('f').addEventListener('change',()=>{const f=$('f').files[0];if(f){$('dt').textContent=f.name;$('dn').textContent=(f.size/1048576).toFixed(1)+' MB · แตะเพื่อเปลี่ยนไฟล์'}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-fill]');if(!b)return;const ins=[...document.querySelectorAll('#tb input[data-k="'+b.dataset.fill+'"]')];ins.slice(1).forEach(x=>x.value=ins[0].value)});
